# Plantilla de servicio de Nubeduca (LIB-01).
# Al copiarla: cambia `service`, SERVICIO, EVENT_SOURCE, el nombre de la tabla, las rutas
# (según tu OpenAPI en nubeduca-contratos) y el EventPattern de la regla del consumidor.
#
# Parámetros (serverless deploy --stage dev --param="outbox=pipe"):
#   busName   bus de EventBridge. Si no se pasa, se lee del SSM /nubeduca/<stage>/bus-name
#             que crea PLT-03 (lms-<stage>); si ese parámetro no existe, usa 'lms' (LocalStack).
#   outbox    lambda (por defecto) | pipe. Cómo viaja el outbox del Stream al bus.
#   authMode  mock (por defecto, hasta AUTH-01) | cognito.

# Cada integrante usa su propia org de Serverless; cámbiala por la tuya.
org: tu-org
service: nubeduca-ms-plantilla

params:
  default:
    outbox: lambda
    authMode: mock

custom:
  busName: ${param:busName, ssm:/nubeduca/${sls:stage}/bus-name, 'lms'}
  # Con outbox=lambda se enciende el relay; con outbox=pipe se crea el Pipe.
  relayEncendido:
    lambda: true
    pipe: false

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole   # Learner Lab no deja crear roles
  # PLT-06: trazas de API Gateway y Lambda en X-Ray.
  tracing:
    apiGateway: true
    lambda: true
  environment:
    SERVICIO: ms-plantilla
    EVENT_SOURCE: lms.plantilla
    TABLA: ${sls:stage}-t_plantilla
    EVENT_BUS: ${self:custom.busName}
    AUTH_MODE: ${param:authMode}

package:
  patterns:
    - '!tests/**'
    - '!scripts/**'
    - '!.venv/**'
    - '!requirements-dev.txt'

functions:
  salud:
    handler: api/salud.lambda_handler
    events:
      - http: { path: /health, method: get, cors: true }

  ejemplos:
    handler: api/ejemplos.lambda_handler
    events:
      # Con AUTH-01 listo, agrega a cada ruta protegida:
      #   authorizer: { type: COGNITO_USER_POOLS, arn: ${param:userPoolArn} }
      - http: { path: /examples, method: get, cors: true }
      - http: { path: /examples, method: post, cors: true }

  # Outbox → bus (solo si outbox=lambda). Lee el Stream y publica los EVENTO#.
  relayOutbox:
    handler: relay/stream_a_bus.lambda_handler
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt Tabla.StreamArn
          enabled: ${self:custom.relayEncendido.${param:outbox}}
          startingPosition: LATEST
          batchSize: 10
          maximumRetryAttempts: 10
          filterPatterns:
            - eventName: [INSERT]
              dynamodb:
                Keys:
                  sk:
                    S: [{ prefix: 'EVENTO#' }]

  # Regla del bus → cola → este Lambda. Una regla y una cola por consumidor.
  consumidor:
    handler: consumidores/ejemplo.lambda_handler
    events:
      - sqs:
          arn: !GetAtt ColaEventos.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

resources:
  Conditions:
    UsarPipe: !Equals ['${param:outbox}', 'pipe']

  Resources:
    # Tabla única: PK tenant_id + sk. El Stream alimenta el outbox.
    Tabla:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${sls:stage}-t_plantilla
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: tenant_id, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: tenant_id, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # Outbox con EventBridge Pipes (outbox=pipe). Verificar en AWS que el LabRole lo permita.
    PipeOutbox:
      Type: AWS::Pipes::Pipe
      Condition: UsarPipe
      Properties:
        Name: ${self:service}-${sls:stage}-outbox
        RoleArn: arn:aws:iam::${aws:accountId}:role/LabRole
        Source: !GetAtt Tabla.StreamArn
        SourceParameters:
          DynamoDBStreamParameters:
            StartingPosition: LATEST
            BatchSize: 1
            MaximumRetryAttempts: 10
          FilterCriteria:
            Filters:
              - Pattern: '{"eventName":["INSERT"],"dynamodb":{"Keys":{"sk":{"S":[{"prefix":"EVENTO#"}]}}}}'
        Target: arn:aws:events:${aws:region}:${aws:accountId}:event-bus/${self:custom.busName}
        TargetParameters:
          InputTemplate: '<$.dynamodb.NewImage.detail.S>'
          EventBridgeEventBusParameters:
            Source: '$.dynamodb.NewImage.source.S'
            DetailType: '$.dynamodb.NewImage.detailType.S'

    # --- Consumidor ---------------------------------------------------------------
    ColaEventosDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-plantilla-eventos-dlq
        MessageRetentionPeriod: 1209600

    ColaEventos:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: nubeduca-${sls:stage}-plantilla-eventos
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaEventosDLQ.Arn
          maxReceiveCount: 5

    ReglaConsumidor:
      Type: AWS::Events::Rule
      Properties:
        Name: nubeduca-${sls:stage}-plantilla
        EventBusName: ${self:custom.busName}
        EventPattern:
          source: [lms.plantilla]
          detail-type: [lms.plantilla.example.created.v1]
        Targets:
          - Id: cola-plantilla
            Arn: !GetAtt ColaEventos.Arn

    PoliticaColaEventos:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref ColaEventos]
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: events.amazonaws.com }
              Action: sqs:SendMessage
              Resource: !GetAtt ColaEventos.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ReglaConsumidor.Arn

    # PLT-06: alarma si algún evento termina en la DLQ (falló 5 veces).
    AlarmaDLQ:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: nubeduca-${sls:stage}-plantilla-eventos-dlq
        AlarmDescription: Hay eventos que ms-plantilla no pudo procesar
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ColaEventosDLQ.QueueName
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

  Outputs:
    TablaNombre:
      Value: !Ref Tabla
    ColaEventosUrl:
      Value: !Ref ColaEventos
